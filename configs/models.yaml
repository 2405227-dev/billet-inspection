models:
  billet_detector:
    name: "billet-yolov8x-det"
    version: "v2.4.1"
    framework: "onnxruntime"
    input_shape: [1, 3, 640, 640]
    confidence_threshold: 0.85
    iou_threshold: 0.45
    device: "cuda:0"
    fallback_device: "cpu"
    runtime_model_path: "models/billet_detector/billet_detector.onnx"

  defect_detector:
    name: "surface-defect-ensemble-seg"
    version: "v3.2.0"
    framework: "onnxruntime"
    input_shape: [1, 3, 1024, 1024]
    tile_size: 512
    tile_overlap_pct: 0.25
    confidence_threshold: 0.65
    classes:
      - "longitudinal_crack"
      - "transverse_crack"
      - "corner_crack"
      - "hairline_crack"
      - "surface_breaking_crack"
      - "star_crack"
      - "seam"
      - "lap"
      - "scab"
      - "sliver"
      - "scale"
      - "pit"
      - "scratch"
      - "gouge"
      - "dent"
      - "corner_damage"
      - "surface_abnormality"
      - "unknown_anomaly"
    runtime_model_path: "models/defect_detector/defect_detector.onnx"

  crack_segmentation:
    name: "fine-crack-unet-hrnet"
    version: "v4.1.0"
    framework: "onnxruntime"
    tile_size: 256
    overlap: 64
    multi_scale_factors: [0.75, 1.0, 1.25]
    clahe_clip_limit: 3.0
    clahe_grid_size: [8, 8]
    min_crack_pixel_area: 12
    runtime_model_path: "models/crack_segmentation/crack_segmentation.onnx"

  ocr:
    name: "paddleocr-billet-endface"
    version: "v2.1.0"
    provider: "PaddleOCR"
    fallback_provider: "IndustrialHeuristicOCR"
    confidence_threshold: 0.85
    expected_patterns:
      - "^[A-Z0-9]{3,5}-[0-9]{2,4}[A-Z]-[0-9]{3,5}$" # e.g. HEAT-26A-1042
      - "^[0-9]{2}[A-Z]-[0-9]{4}$"                   # e.g. 26A-1042
      - "^BATCH-[0-9]{3,5}$"

  barcode:
    name: "industrial-matrix-decoder"
    version: "v1.5.0"
    symbologies: ["QR_CODE", "CODE_128", "DATA_MATRIX"]
