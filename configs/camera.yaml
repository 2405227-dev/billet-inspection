cameras:
  - id: "CAM-01"
    name: "Top Surface High-Speed Matrix"
    position: "TOP"
    orientation: "NADIR_0_DEG"
    camera_type: "GigE_AREA_SCAN"
    sensor_model: "Sony Pregius IMX530 CMOS"
    resolution:
      width: 4096
      height: 2160
    fps: 60
    exposure_us: 1200
    gain_db: 4.5
    pixel_pitch_um: 2.74
    lens_focal_length_mm: 35.0
    field_of_view_mm: [1800, 950]
    calibration_id: "CALIB-CAM01-2026-v4"
    pixel_to_mm_ratio: 0.439
    lighting_profile: "POLARIZED_WHITE_LED_COAXIAL"
    hardware_trigger: true
    encoder_synced: true

