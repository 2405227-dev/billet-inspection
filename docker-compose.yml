services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: billet_inspection_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/storage/billet_inspection.db
      - ENV=production
      - DEBUG=false
    volumes:
      - ./storage:/app/storage
      - ./configs:/app/configs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: billet_inspection_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
